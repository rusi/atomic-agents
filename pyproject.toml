[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "atomic-agents"
version = "1.0.23"
description = "A versatile framework for creating and managing intelligent agents."
authors = [
    {name = "Kenny Vaneetvelde", email = "kenny.vaneetvelde@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9,<4.0"
dependencies = [
    "instructor>=1.3.4,<2.0.0",
    "pydantic>=2.8.0,<3.0.0", 
    "rich>=13.7.1,<14.0.0",
    "gitpython>=3.1.43,<4.0.0",
    "pyfiglet>=1.0.2,<2.0.0",
    "textual>=0.82.0,<1.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "requests>=2.32.3,<3.0.0"
]

[project.urls]
Homepage = "https://github.com/BrainBlend-AI/atomic-agents"
Repository = "https://github.com/BrainBlend-AI/atomic-agents"

[project.scripts]
atomic = "atomic_assembler.main:main"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = [
    "atomic-agents/atomic_agents",
    "atomic-assembler/atomic_assembler"
]
package-dir = "atomic-agents"

[tool.pdm.dev-dependencies]
dev = [
    "black>=24.8.0,<25.0.0",
    "flake8>=7.1.1,<8.0.0", 
    "pdoc3>=0.11.1,<1.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "openai>=1.35.12,<2.0.0",
    "sphinx>=7.2.6,<8.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "myst-parser>=2.0.0,<3.0.0", 
    "sphinx-copybutton>=0.5.2,<1.0.0",
    "sphinx-design>=0.5.0,<1.0.0",
    "sphinx-autobuild>=2024.2.4,<2025.0.0",
    "youtube-transcript-api>=0.6.3",
    "google-api-python-client>=2.161.0",
    "sympy>=1.13.3"
]

[tool.black]
line-length = 127
